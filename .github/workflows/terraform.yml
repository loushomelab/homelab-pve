name: "Terraform CI/CD"

on:
  push:
    branches:
      - main
  pull_request:

env:
  TF_LOG: INFO
  # PROXMOX_VE_ENDPOINT 和 PROXMOX_VE_API_TOKEN 现已迁移到 HCP Terraform Workspace Variables 中，
  # 并在内网的 TFC Agent LXC 内执行，无需在 GitHub Actions 级别注入。

jobs:
  terraform:
    name: "Terraform"
    runs-on: [self-hosted, macOS, ARM64, langshi]
    defaults:
      run:
        working-directory: ./cluster
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          # 关闭 wrapper，防止其吞掉 exit code
          terraform_wrapper: false 

      - name: Terraform Format
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        if: github.event_name == 'pull_request'
        run: terraform plan -no-color -out=tfplan
        continue-on-error: true

      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve
